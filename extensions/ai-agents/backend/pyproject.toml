[project]
name = "superset-ai-agent"
version = "0.1.0"
license = "Apache-2.0"

[tool.ruff]
line-length = 120
# Superset 6.1 runs extension backends on Python 3.10.
target-version = "py310"

[tool.ruff.lint]
ignore = ["D100"]

[tool.apache_superset_extensions.build]
include = [
    "src/text_to_bi/superset_ai_agent/**/*.py",
    "src/text_to_bi/superset_ai_agent/**/*.json",
    "src/text_to_bi/superset_ai_agent/**/*.md",
]
exclude = []
