[project]
name = "superset-semantic-layer"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "sqlglot==28.10.1",
]

[tool.ruff]
line-length = 120
# Superset 6.1 runs extension backends on Python 3.10.
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E501"]
ignore = ["D100"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is sent to the model as written, so its lines are not wrapped.
"src/text_to_bi/superset_semantic_layer/modules/data_dictionary/autofill/prompts/*.py" = ["E501"]

[tool.apache_superset_extensions.build]
include = [
    "src/text_to_bi/superset_semantic_layer/**/*.py",
    "src/text_to_bi/superset_semantic_layer/**/*.json",
    "src/text_to_bi/superset_semantic_layer/**/*.md",
]
exclude = []
