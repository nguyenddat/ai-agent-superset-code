[project]
name = "text-to-bi"
version = "0.1.0"
description = "Local development environment for the Text to BI Superset extensions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=2.13,<3",
    "langchain>=1.1,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2.0,<3",
    "requests>=2.32,<3",
    # Left unpinned so they resolve to the versions Superset's extension packages require.
    "sqlalchemy",
    "sqlglot",
]

[dependency-groups]
dev = [
    "apache-superset-extensions-cli",
    "playwright>=1.64.1",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [
    "extensions/ai-agents/backend/src",
    "extensions/semantic-layer/backend/src",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["D100"]
