services:
  warehouse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-data_wh}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-bi}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-bi_dev_password}
    ports:
      - "${WAREHOUSE_DB_PORT:-5433}:5432"
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data
      - ./data_wh/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER:-bi} -d ${WAREHOUSE_DB:-data_wh}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  superset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SUPERSET_DB:-superset}
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset_dev_password}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER:-superset} -d ${SUPERSET_DB:-superset}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  superset-init:
    image: text-to-bi-superset:6.1.0
    build:
      context: ./superset
      dockerfile: Dockerfile
    command: >-
      sh -c 'superset db upgrade && superset init && python /app/pythonpath/create_admin.py &&
      python /app/pythonpath/bootstrap_warehouse.py &&
      python /app/pythonpath/bootstrap_metrics.py && python /app/pythonpath/bootstrap_dashboard.py &&
      python /app/pythonpath/bootstrap_governance.py'
    env_file:
      - ./.env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-development-secret-change-me}
      SUPERSET_DB: ${SUPERSET_DB:-superset}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER:-superset}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset_dev_password}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_FIRST_NAME: ${SUPERSET_ADMIN_FIRST_NAME:-Superset}
      SUPERSET_ADMIN_LAST_NAME: ${SUPERSET_ADMIN_LAST_NAME:-Admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_PORT: 5432
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB:-data_wh}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-bi}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-bi_dev_password}
      WAREHOUSE_SUPERSET_NAME: ${WAREHOUSE_SUPERSET_NAME:-Weather Warehouse}
      # Read-only login that the "Text to BI Governance" connection uses for the AI Agent reporting views.
      TEXT_TO_BI_REPORTING_DB_PASSWORD: ${TEXT_TO_BI_REPORTING_DB_PASSWORD:-reporting_dev_password}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/create_admin.py:/app/pythonpath/create_admin.py:ro
      - ./superset/bootstrap_warehouse.py:/app/pythonpath/bootstrap_warehouse.py:ro
      - ./superset/bootstrap_metrics.py:/app/pythonpath/bootstrap_metrics.py:ro
      - ./superset/bootstrap_dashboard.py:/app/pythonpath/bootstrap_dashboard.py:ro
      - ./superset/bootstrap_governance.py:/app/pythonpath/bootstrap_governance.py:ro
      - superset_extensions:/app/superset_home/extensions
    depends_on:
      superset-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
    restart: "no"

  superset:
    image: text-to-bi-superset:6.1.0
    build:
      context: ./superset
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "gunicorn --bind 0.0.0.0:8088 --worker-class gthread --workers 1 --threads 16 --timeout 120 'superset.app:create_app()'"]
    env_file:
      - ./.env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-development-secret-change-me}
      SUPERSET_DB: ${SUPERSET_DB:-superset}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER:-superset}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset_dev_password}
    ports:
      - "${SUPERSET_PORT:-8089}:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      # Extension bundles live in a named volume filled with `docker compose cp` (see AGENTS.md): bind-mounting the
      # .supx files from the host drive served stale copies under Docker Desktop's Hyper-V file sharing.
      - superset_extensions:/app/superset_home/extensions
    depends_on:
      superset-init:
        condition: service_completed_successfully
      warehouse-db:
        condition: service_healthy
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    command: ["bash", "/opt/airflow-bootstrap.sh"]
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__LOGGING__SYMLINK_LATEST_LOG: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-airflow-secret-change-me}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_PORT: 5432
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB:-data_wh}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-bi}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-bi_dev_password}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      warehouse-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  warehouse_db_data:
  superset_db_data:
  superset_extensions:
  airflow_home:
